<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Browser Automation Live Example</title>
    <style>
        :root { --bg: #0f1117; --panel: #161a22; --gold: #c9a227; --text: #f6f1e7; --muted: #9a9a9a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
        .wrap { max-width: 820px; margin: 0 auto; }
        .btn { border: 1px solid rgba(201,162,39,0.5); color: var(--gold); text-decoration: none; padding: 9px 13px; display: inline-block; }
        .btn:hover { background: var(--gold); color: #101010; }
        .card { margin-top: 1rem; background: var(--panel); border: 1px solid rgba(201,162,39,0.25); padding: 1rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        p { color: var(--muted); line-height: 1.6; }
        .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
        input { flex: 1; min-width: 240px; background: #0f141f; border: 1px solid rgba(201,162,39,0.25); color: var(--text); padding: 10px; }
        button { border: 1px solid rgba(201,162,39,0.5); background: transparent; color: var(--gold); padding: 10px 12px; cursor: pointer; }
        button:hover { background: var(--gold); color: #111; }
        .steps { margin-top: 1rem; padding-left: 1.1rem; }
        .steps li { margin-bottom: 0.45rem; color: var(--muted); }
        .steps li.done { color: #d8c182; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="index.html#aiml" class="btn">Back to Portfolio</a>
        <div class="card">
            <h1>AI Browser Automation</h1>
            <p>Live example: enter a natural-language command and generate a browser action plan.</p>
            <div class="controls">
                <input id="command" placeholder="Example: Login, open dashboard, search for invoices, export CSV" />
                <button id="runBtn">Generate Plan</button>
            </div>
            <ol class="steps" id="steps"></ol>
        </div>
    </div>

    <script>
        const commandInput = document.getElementById('command');
        const stepsEl = document.getElementById('steps');

        function buildSteps(command) {
            const c = command.toLowerCase();
            const steps = ['Open target website'];
            if (c.includes('login') || c.includes('sign in')) steps.push('Authenticate with provided credentials');
            if (c.includes('dashboard')) steps.push('Navigate to dashboard page');
            if (c.includes('search') || c.includes('find')) steps.push('Use search input with target query');
            if (c.includes('filter')) steps.push('Apply requested filters');
            if (c.includes('export') || c.includes('download')) steps.push('Trigger export/download action');
            steps.push('Validate result and capture completion status');
            return [...new Set(steps)];
        }

        function renderAndSimulate(steps) {
            stepsEl.innerHTML = '';
            steps.forEach((step) => {
                const li = document.createElement('li');
                li.textContent = `${step} [pending]`;
                stepsEl.appendChild(li);
            });

            const items = [...stepsEl.querySelectorAll('li')];
            let i = 0;
            const timer = setInterval(() => {
                if (i >= items.length) {
                    clearInterval(timer);
                    return;
                }
                items[i].classList.add('done');
                items[i].textContent = items[i].textContent.replace('[pending]', '[done]');
                i += 1;
            }, 420);
        }

        document.getElementById('runBtn').addEventListener('click', () => {
            const command = commandInput.value.trim();
            if (!command) {
                renderAndSimulate(['Open target website', 'Interpret request intent', 'Execute default safe action', 'Report completion status']);
                return;
            }
            renderAndSimulate(buildSteps(command));
        });
    </script>
</body>
</html>
