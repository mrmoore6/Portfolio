<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Agent - Live Example</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #252540;
            --field: #161629;
            --border: #434367;
            --text: #eeeeee;
            --muted: #9a9ab5;
            --ok: #4caf50;
            --warn: #ff9800;
            --error: #f44336;
            --live: #2196f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1.2rem;
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.9rem;
        }

        .chip {
            display: inline-block;
            border: 1px solid #54547c;
            color: #b6b6cd;
            text-decoration: none;
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.45rem 0.7rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
        }

        .chip:hover {
            border-color: #8a8ab4;
            color: #fff;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.01em;
        }

        .section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.95rem;
            margin-bottom: 0.8rem;
        }

        .section h3 {
            color: #c3c3de;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 0.76rem;
            margin-bottom: 0.3rem;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #48486c;
            border-radius: 6px;
            background: var(--field);
            color: #fff;
            padding: 0.62rem;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        textarea {
            min-height: 118px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            line-height: 1.42;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin: 0.75rem 0;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 0.62rem 0.86rem;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            color: #fff;
        }

        .btn-run { background: var(--ok); }
        .btn-continue { background: var(--warn); display: none; }
        .btn-continue.show { display: inline-block; animation: pulse 1s infinite; }
        .btn-pause { background: var(--warn); }
        .btn-close { background: #6b6b83; }
        .btn-clear { background: #343449; color: #c6c6d8; }
        .btn-save { background: #36364f; color: #fff; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status {
            border-radius: 6px;
            text-align: center;
            font-size: 0.83rem;
            font-weight: 700;
            padding: 0.52rem;
            margin-bottom: 0.75rem;
        }

        .status.ready { background: rgba(76, 175, 80, 0.28); color: #d8f5da; }
        .status.running { background: rgba(255, 152, 0, 0.28); color: #ffe5c1; }
        .status.captcha { background: rgba(255, 152, 0, 0.45); color: #fff0db; animation: pulse 1s infinite; }

        .live-frame {
            width: 100%;
            height: 340px;
            border: 1px solid #4c4c6e;
            border-radius: 6px;
            background: linear-gradient(180deg, #10101c, #07070d);
            display: grid;
            place-items: center;
            color: #7d7d9a;
            font-size: 0.86rem;
            text-align: center;
            padding: 0.8rem;
        }

        #log {
            background: #11111d;
            border: 1px solid #464663;
            border-radius: 6px;
            padding: 0.62rem;
            height: 250px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            display: grid;
            gap: 0.25rem;
        }

        .log-info { color: #a6a6c2; }
        .log-success { color: var(--ok); }
        .log-error { color: var(--error); }
        .log-captcha { color: var(--warn); font-weight: 700; }
        .log-live { color: var(--live); }

        .tiny-note {
            color: var(--muted);
            font-size: 0.72rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 700px) {
            body {
                padding: 0.8rem;
            }

            .buttons {
                gap: 0.45rem;
            }

            button {
                width: 100%;
            }

            .live-frame {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-bar">
            <a href="index.html#aiml" class="chip">Back to Portfolio</a>
            <span class="chip">Static UI Replica</span>
        </div>

        <h1>Browser Agent</h1>

        <section class="section">
            <h3>API Keys</h3>
            <label for="browserlessKey">Browserless API Key</label>
            <input id="browserlessKey" type="password" placeholder="Your Browserless API key">
            <button class="btn-save" id="saveKeysBtn" type="button">Save Keys</button>
        </section>

        <section class="section">
            <h3>Task</h3>
            <label for="steps">Steps (one per line)</label>
            <textarea id="steps" placeholder="search for weather
click first result
capture screenshot"></textarea>
        </section>

        <div class="buttons">
            <button class="btn-run" id="runBtn" type="button">Run</button>
            <button class="btn-continue" id="continueBtn" type="button">Continue (CAPTCHA Done)</button>
            <button class="btn-pause" id="pauseBtn" type="button">Pause for CAPTCHA</button>
            <button class="btn-close" id="closeBtn" type="button">Close Browser</button>
            <button class="btn-clear" id="clearBtn" type="button">Clear Log</button>
        </div>

        <div id="status" class="status ready">Ready</div>

        <section class="section">
            <h3>Live View</h3>
            <div class="live-frame" id="liveFrame">Live session preview appears here while automation is running.</div>
            <p class="tiny-note">Demo mode: this page simulates live updates and logs without backend execution.</p>
        </section>

        <section class="section">
            <h3>Log</h3>
            <div id="log"></div>
        </section>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const continueBtn = document.getElementById('continueBtn');
        const liveFrame = document.getElementById('liveFrame');
        const stepsInput = document.getElementById('steps');

        let runTimer = null;

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-${type}`;
            line.textContent = `${new Date().toLocaleTimeString()} ${message}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, stateClass) {
            statusEl.textContent = text;
            statusEl.className = `status ${stateClass}`;
        }

        function stopRunTimer() {
            clearTimeout(runTimer);
            runTimer = null;
        }

        document.getElementById('saveKeysBtn').addEventListener('click', () => {
            const value = document.getElementById('browserlessKey').value.trim();
            if (!value) {
                log('No API key entered. Stored empty value in demo mode.', 'info');
            } else {
                log('Keys saved', 'success');
            }
        });

        document.getElementById('runBtn').addEventListener('click', () => {
            stopRunTimer();
            continueBtn.classList.remove('show');
            setStatus('Running...', 'running');

            const steps = stepsInput.value
                .split('\n')
                .map((line) => line.trim())
                .filter(Boolean);

            log('Starting run', 'info');
            log(`Loaded ${steps.length || 1} automation step(s)`, 'info');
            liveFrame.textContent = 'Navigating target website and initializing live browser stream...';
            log('Live view connected', 'live');

            if (!steps.length) {
                log('No steps provided, using default safe sequence', 'info');
            }

            runTimer = setTimeout(() => {
                log('CAPTCHA detected. Manual input required.', 'captcha');
                continueBtn.classList.add('show');
                setStatus('CAPTCHA - Solve then Continue', 'captcha');
                liveFrame.textContent = 'Automation paused at verification checkpoint. Complete CAPTCHA and press Continue.';
            }, 1200);
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            stopRunTimer();
            continueBtn.classList.add('show');
            setStatus('Paused - Awaiting user action', 'captcha');
            log('Paused manually. Resolve challenge and continue.', 'captcha');
            liveFrame.textContent = 'Session paused manually for challenge resolution.';
        });

        continueBtn.addEventListener('click', () => {
            continueBtn.classList.remove('show');
            setStatus('Running...', 'running');
            log('Continuing after CAPTCHA', 'info');
            liveFrame.textContent = 'Continuing execution and completing final automation steps...';

            stopRunTimer();
            runTimer = setTimeout(() => {
                log('Execution completed successfully', 'success');
                setStatus('Ready', 'ready');
                liveFrame.textContent = 'Run finished. Session is idle and ready for the next task.';
            }, 900);
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            stopRunTimer();
            continueBtn.classList.remove('show');
            setStatus('Ready', 'ready');
            log('Browser closed', 'info');
            liveFrame.textContent = 'Session closed. Start a new run to reopen live browser preview.';
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            logEl.innerHTML = '';
        });

        log('Browser agent initialized', 'success');
        log('Waiting for task input', 'info');
    </script>
</body>
</html>
